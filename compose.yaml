services:
  engdis:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    shm_size: "256m"
    mem_limit: "1280m"
    mem_reservation: "512m"
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1280M
        reservations:
          memory: 512M
    environment:
      - ED_UNIT=${ED_UNIT:-0}
      - ED_UNITS=${ED_UNITS:-}
      - ED_PASSES=${ED_PASSES:-1}
      - ED_DRY_RUN=${ED_DRY_RUN:-1}
      - ED_SKIP=${ED_SKIP:-}
      - ED_CDP_PORT=9225
      - ED_USER=${ED_USER:-}
      - ED_PASS=${ED_PASS:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ED_CRED=/run/secrets/engdis_cred
    volumes:
      - engdis_data:/data
      - ${ED_CRED_FILE:-~/.config/engdis/cred}:/run/secrets/engdis_cred:ro
    restart: "no"

volumes:
  engdis_data:
